<header class="site-header">
    <div class="header-container">
        <a href="{{ .Site.BaseURL }}" class="site-logo">
            <span class="site-title">{{ .Site.Title }}</span>
        </a>


        <nav class="main-nav" aria-label="Huvudnavigation">
            <ul class="nav-list">
                {{ range .Site.Menus.main }}
                {{ if .HasChildren }}
                <li class="nav-item">
                    <details class="home-year-menu">
                    <summary class="nav-link">
                        {{ .Name }}
                    </summary>
                    <ul class="nav-dropdown-menu">
                        {{ range .Children }}
                        <li>
                            <a href="{{ .URL }}" class="nav-dropdown-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
                                {{ .Name }}
                            </a>
                        </li>
                        {{ end }}
                    </ul>
                    </details>
                </li>
                {{ else }}
                <li class="nav-item">
                    <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
                        {{ .Name }}
                    </a>
                </li>
                {{ end }}
                {{ end }}
            </ul>
        </nav>

        <button class="mobile-menu-toggle" aria-label="Öppna meny" aria-expanded="false" id="mobile-menu-btn">
            <span class="hamburger"></span>
        </button>
    </div>
</header>

<script src="{{ "js/municipal-navigation.js" | relURL }}?v={{ readFile "static/js/municipal-navigation.js" | sha256 }}" defer></script>
