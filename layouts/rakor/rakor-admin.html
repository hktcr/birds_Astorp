<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "css/rakor-map.css" | relURL }}">
</head>
<body>

<div id="app-container">
    <div id="map"></div>
    <div id="ui-panel">
        <div class="panel-header">
            <h2>Råkoinventering</h2>
            <p>Åstorps kommun (250x250m rutor)</p>
        </div>
        
        <div class="panel-section">
            <label>Markerade rutor: <span id="selected-count">0</span> st</label>
            <div id="selected-list" class="grid-id-list"></div>
        </div>

        <div class="panel-section input-section">
            <label for="nest-count">Antal bon i klunga:</label>
            <input type="number" id="nest-count" min="0" value="0">
            
            <label for="nest-date" style="margin-top: 5px;">Datum:</label>
            <input type="date" id="nest-date">

            <label for="nest-coord" style="margin-top: 5px;">Exakt koordinat (frivillig):</label>
            <input type="text" id="nest-coord" placeholder="T.ex. 56.13, 12.92">

            <button id="btn-save-nests" class="btn btn-primary" style="margin-top: 10px;">Spara</button>
        </div>

        <div class="panel-section info-text">
            Sätt <b>0</b> bon för att markera dem som "Inventerade - tomt". 
        </div>

        <div class="panel-section">
            <label>Visningsalternativ</label>
            <label style="font-weight: normal; font-size: 0.9em; cursor: pointer;">
                <input type="checkbox" id="toggle-grid-ids"> Visa rutas koordinat/ID
            </label>
        </div>

        <div class="panel-section bottom-actions">
            <button id="btn-export-image" class="btn btn-secondary"><i class="fa fa-camera"></i> Karta som bild</button>
            <button id="btn-copy-session" class="btn btn-primary"><i class="fa fa-copy"></i> Kopiera för gAIa</button>
            <button id="btn-clear-selection" class="btn btn-danger">Avmarkera</button>
        </div>
    </div>
</div>

<!-- Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Custom JS -->
<script>
    const geojsonUrl = '{{ "data/astorp-kommun.geojson" | relURL }}';
    const gridUrl = '{{ "data/astorp-grid-250m.geojson" | relURL }}';
    const dbUrl = '{{ "data/rakobservations.json" | relURL }}';
</script>
<script src="{{ "js/rakor-admin.js" | relURL }}"></script>

</body>
</html>
