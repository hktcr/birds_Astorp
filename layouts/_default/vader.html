{{ define "main" }}
<section class="vader-page">
    <div class="vader-container">

        <h1 class="vader-title">{{ .Title }}</h1>

        <div class="vader-intro">
            {{ .Content }}
        </div>

        <!-- Fältrapport-väljare -->
        <div class="vader-blog-picker">
            <select id="vader-blog-select" class="vader-blog-select">
                <option value="">Visa fältrapport i diagrammen…</option>
            </select>
            <div id="vader-blog-preview" class="vader-blog-preview" style="display:none;"></div>
        </div>

        <!-- Global månadsväljare -->
        <div class="vader-month-bar" id="vader-month-bar">
            <select id="vader-month-select">
                <option value="all">Hela året</option>
                <option value="2026-01">Januari 2026</option>
                <option value="2026-02">Februari 2026</option>
                <option value="2026-03">Mars 2026</option>
                <option value="2026-04">April 2026</option>
                <option value="2026-05">Maj 2026</option>
                <option value="2026-06">Juni 2026</option>
                <option value="2026-07">Juli 2026</option>
                <option value="2026-08">Augusti 2026</option>
                <option value="2026-09">September 2026</option>
                <option value="2026-10">Oktober 2026</option>
                <option value="2026-11">November 2026</option>
                <option value="2026-12">December 2026</option>
            </select>
            <label class="vader-smooth-label" id="wind-smooth-label">
                <input type="checkbox" id="wind-smooth-toggle" checked> Jämna ut vinddata
            </label>
        </div>

        <!-- Kvintett: fem diagram vertikalt -->
        <div class="vader-triptych">
            <!-- 1. Artlista (Progress) -->
            <div class="vader-chart-box">
                <canvas id="progress-chart"></canvas>
            </div>

            <!-- 2. Vindkomponenter -->
            <div class="vader-chart-box">
                <canvas id="wind-chart"></canvas>
                <div class="vader-chart-source">SMHI, Helsingborg A</div>
            </div>

            <!-- 3. Temperatur -->
            <div class="vader-chart-box">
                <canvas id="temp-chart"></canvas>
                <div class="vader-chart-source">SMHI, Helsingborg A</div>
            </div>

            <!-- 4. Nederbörd -->
            <div class="vader-chart-box">
                <canvas id="precip-chart"></canvas>
                <div class="vader-chart-source">SMHI, Åstorp</div>
            </div>

            <!-- 5. Vattenföring -->
            <div class="vader-chart-box">
                <canvas id="flow-chart"></canvas>
                <div class="vader-chart-source">SMHI, Forsmöllan (Rönne å)</div>
            </div>
        </div>

    </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
<script>
    var YEAR_GOAL = 150;

    // Observationsdata (inbäddad vid byggtid)
    var data = {{ index .Site.Data "checklist-2026" | jsonify | safeJS }};

    // Bloggposter (inbäddad vid byggtid)
    var blogPosts = [
        {{ range $i, $p := (where .Site.RegularPages "Section" "posts") }}
        {{ if not .Draft }}
        { date: "{{ .Date.Format "2006-01-02" }}", title: {{ .Title | jsonify }}, url: "{{ .RelPermalink }}", excerpt: {{ .Plain | truncate 200 | jsonify }} },
        {{ end }}
        {{ end }}
    ];

    // SMHI-stationer
    var STATION_TEMP = 62040;   // Helsingborg A (param 19 & 20)
    var STATION_PRECIP = 62060; // Åstorp (param 5)
    var STATION_FLOW = 2372;    // Forsmöllans KRV, Rönne å (vattenföring)

    // Gemensam x-axelkonfiguration
    var timeScaleConfig = {
        type: 'time',
        time: {
            unit: 'month',
            displayFormats: { month: 'MMM' },
            tooltipFormat: 'd MMM yyyy'
        },
        min: '2026-01-01',
        max: '2026-12-31',
        grid: {
            color: 'rgba(0,0,0,0.06)',
            drawTicks: false
        },
        border: { dash: [4, 4] },
        ticks: {
            font: { family: 'Inter', size: 11 },
            color: '#666'
        }
    };

    // ================================================================
    // CHART 1: Artprogress
    // ================================================================
    function buildProgressChart() {
        var canvas = document.getElementById('progress-chart');
        if (!canvas || !data || !data.observations) return;

        var seen = {};
        var cumulative = [];
        var sorted = data.observations.slice().sort(function (a, b) {
            return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
        });
        sorted.forEach(function (obs) {
            if (!seen[obs.species]) {
                seen[obs.species] = true;
                cumulative.push({ x: obs.date, y: Object.keys(seen).length });
            }
        });

        // Förläng linjen till idag
        var today = new Date().toISOString().slice(0, 10);
        if (cumulative.length > 0 && cumulative[cumulative.length - 1].x < today) {
            cumulative.push({ x: today, y: cumulative[cumulative.length - 1].y });
        }

        var startDate = cumulative.length > 0 ? cumulative[0].x : '2026-01-22';

        new Chart(canvas, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Antal arter',
                    data: cumulative,
                    borderColor: '#2B6A4F',
                    backgroundColor: function (ctx) {
                        var chart = ctx.chart;
                        var area = chart.chartArea;
                        if (!area) return 'rgba(43, 106, 79, 0.08)';
                        var gradient = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
                        gradient.addColorStop(0, 'rgba(43, 106, 79, 0.12)');
                        gradient.addColorStop(1, 'rgba(43, 106, 79, 0.01)');
                        return gradient;
                    },
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    pointHitRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                aspectRatio: window.innerWidth < 600 ? 1.6 : 2.5,
                scales: {
                    x: JSON.parse(JSON.stringify(timeScaleConfig)),
                    y: {
                        min: 0,
                        max: 170,
                        grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
                        ticks: {
                            stepSize: 25,
                            font: { family: 'Inter', size: 11 },
                            color: '#666'
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(30,66,32,0.9)',
                        titleFont: { family: 'Inter' },
                        bodyFont: { family: 'Inter' },
                        callbacks: {
                            label: function (ctx) { return ctx.parsed.y + ' arter'; }
                        }
                    },
                    annotation: {
                        annotations: {
                            goalLine: {
                                type: 'line',
                                yMin: YEAR_GOAL,
                                yMax: YEAR_GOAL,
                                borderColor: 'rgba(43, 106, 79, 0.35)',
                                borderWidth: 1.5,
                                borderDash: [6, 4],
                                label: {
                                    display: true,
                                    content: 'Mål: ' + YEAR_GOAL + ' arter',
                                    position: 'end',
                                    backgroundColor: 'rgba(43, 106, 79, 0.8)',
                                    color: '#fff',
                                    font: { family: 'Inter', size: 11, weight: '500' },
                                    padding: { top: 3, bottom: 3, left: 6, right: 6 },
                                    borderRadius: 4
                                }
                            },
                            startPoint: {
                                type: 'point',
                                xValue: startDate,
                                yValue: 1,
                                radius: 5,
                                backgroundColor: '#2B6A4F',
                                borderColor: '#fff',
                                borderWidth: 2
                            }
                        }
                    }
                }
            }
        });
    }

    // ================================================================
    // CHART 2: Temperatur — dag-max (orange) & natt-min (blå)
    // ================================================================
    function fetchSMHI(param, station) {
        var url = 'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/' +
            param + '/station/' + station + '/period/latest-months/data.json';
        return fetch(url).then(function (r) { return r.json(); });
    }

    function buildTempChart() {
        var canvas = document.getElementById('temp-chart');
        if (!canvas) return;

        Promise.all([fetchSMHI(19, STATION_TEMP), fetchSMHI(20, STATION_TEMP)]).then(function (results) {
            var minData = results[0].value || [];
            var maxData = results[1].value || [];

            var minPoints = [];
            var maxPoints = [];
            minData.forEach(function (v) {
                if (v.ref >= '2026-01-01') minPoints.push({ x: v.ref, y: parseFloat(v.value) });
            });
            maxData.forEach(function (v) {
                if (v.ref >= '2026-01-01') maxPoints.push({ x: v.ref, y: parseFloat(v.value) });
            });

            new Chart(canvas, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Dag (max)',
                            data: maxPoints,
                            borderColor: '#C67B4F',
                            backgroundColor: 'rgba(230, 126, 34, 0.06)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 0,
                            pointHitRadius: 8
                        },
                        {
                            label: 'Natt (min)',
                            data: minPoints,
                            borderColor: '#3D4F7C',
                            backgroundColor: 'rgba(44, 62, 130, 0.06)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 0,
                            pointHitRadius: 8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: window.innerWidth < 600 ? 1.4 : 2.0,
                    scales: {
                        x: JSON.parse(JSON.stringify(timeScaleConfig)),
                        y: {
                            grid: {
                                color: function (ctx) {
                                    return ctx.tick.value === 0 ? 'rgba(0,0,0,0.15)' : 'rgba(0,0,0,0.04)';
                                },
                                drawTicks: false
                            },
                            ticks: {
                                callback: function (v) { return v + '°'; },
                                font: { family: 'Inter', size: 11 },
                                color: '#666'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            align: 'end',
                            labels: {
                                usePointStyle: true,
                                pointStyle: 'line',
                                font: { family: 'Inter', size: 11 },
                                color: '#555',
                                padding: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30,66,32,0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            callbacks: {
                                label: function (ctx) {
                                    return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '°C';
                                }
                            }
                        },
                        annotation: {
                            annotations: {
                                zeroLine: {
                                    type: 'line',
                                    yMin: 0, yMax: 0,
                                    borderColor: 'rgba(0,0,0,0.15)',
                                    borderWidth: 1,
                                    borderDash: [3, 3]
                                }
                            }
                        }
                    }
                }
            });
        }).catch(function (err) {
            console.warn('Kunde inte hämta temperaturdata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Temperaturdata kunde inte laddas</p>';
        });
    }

    // ================================================================
    // CHART 3: Nederbörd — blå staplar per dag
    // ================================================================
    function buildPrecipChart() {
        var canvas = document.getElementById('precip-chart');
        if (!canvas) return;

        fetchSMHI(5, STATION_PRECIP).then(function (result) {
            var vals = result.value || [];
            var points = [];
            vals.forEach(function (v) {
                if (v.ref >= '2026-01-01') {
                    points.push({ x: v.ref, y: parseFloat(v.value) });
                }
            });

            new Chart(canvas, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Nederbörd',
                        data: points,
                        backgroundColor: 'rgba(91, 155, 213, 0.6)',
                        borderColor: 'rgba(91, 155, 213, 0.85)',
                        borderWidth: 1,
                        borderRadius: 2,
                        barPercentage: 0.9,
                        categoryPercentage: 0.9
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: window.innerWidth < 600 ? 1.6 : 2.5,
                    scales: {
                        x: JSON.parse(JSON.stringify(timeScaleConfig)),
                        y: {
                            min: 0,
                            grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
                            ticks: {
                                callback: function (v) { return v + ' mm'; },
                                font: { family: 'Inter', size: 11 },
                                color: '#666'
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30,66,32,0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            callbacks: {
                                label: function (ctx) {
                                    return ctx.parsed.y.toFixed(1) + ' mm';
                                }
                            }
                        }
                    }
                }
            });
        }).catch(function (err) {
            console.warn('Kunde inte hämta nederbördsdata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Nederbördsdata kunde inte laddas</p>';
        });
    }

    // ================================================================
    // CHART 4: Vattenföring — linjediagram (m³/s)
    // ================================================================
    function buildFlowChart() {
        var canvas = document.getElementById('flow-chart');
        if (!canvas) return;


        var url = 'https://opendata-download-hydroobs.smhi.se/api/version/latest/parameter/1/station/' +
            STATION_FLOW + '/period/corrected-archive/data.json';

        fetch(url).then(function (r) { return r.json(); }).then(function (result) {
            var vals = result.value || [];
            var startMs = new Date('2026-01-01').getTime();

            // Aggregera till dagsvärden (medel per dag)
            var dayMap = {};
            vals.forEach(function (v) {
                if (v.date >= startMs) {
                    var d = new Date(v.date).toISOString().slice(0, 10);
                    if (!dayMap[d]) dayMap[d] = { sum: 0, count: 0 };
                    dayMap[d].sum += v.value;
                    dayMap[d].count++;
                }
            });

            var points = Object.keys(dayMap).sort().map(function (d) {
                return { x: d, y: Math.round(dayMap[d].sum / dayMap[d].count * 100) / 100 };
            });

            new Chart(canvas, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Vattenföring',
                        data: points,
                        borderColor: '#2A7B8F',
                        backgroundColor: '#2A7B8F',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHitRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: window.innerWidth < 600 ? 1.6 : 2.5,
                    scales: {
                        x: JSON.parse(JSON.stringify(timeScaleConfig)),
                        y: {
                            min: 0,
                            grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
                            ticks: {
                                callback: function (v) { return v + ' m\u00B3/s'; },
                                font: { family: 'Inter', size: 11 },
                                color: '#666'
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30,66,32,0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            callbacks: {
                                label: function (ctx) {
                                    return ctx.parsed.y.toFixed(2) + ' m\u00B3/s';
                                }
                            }
                        }
                    }
                }
            });
        }).catch(function (err) {
            console.warn('Kunde inte hämta vattenföringsdata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Vattenföringsdata kunde inte laddas</p>';
        });
    }

    // Ladda Luxon time adapter, sedan bygg alla diagram
    (function () {
        var s1 = document.createElement('script');
        s1.src = 'https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js';
        s1.onload = function () {
            var s2 = document.createElement('script');
            s2.src = 'https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1';
            s2.onload = function () {
                buildProgressChart();
                buildWindChart();
                buildTempChart();
                buildPrecipChart();
                buildFlowChart();
                setupGlobalMonthSelector();
            };
            document.head.appendChild(s2);
        };
        document.head.appendChild(s1);
    })();

    // ================================================================
    // GLOBAL MÅNADSVÄLJARE — Synkroniserar alla fem diagram
    // ================================================================
    function setMonthZoom(month) {
        // 1. Beräkna datumgränser för Chart.js
        var xMin, xMax;
        if (month === 'all') {
            xMin = '2026-01-01';
            xMax = '2026-12-31';
        } else {
            var year = parseInt(month.substring(0, 4));
            var mon = parseInt(month.substring(5, 7));
            xMin = month + '-01';
            var lastDay = new Date(year, mon, 0).getDate();
            xMax = month + '-' + (lastDay < 10 ? '0' + lastDay : lastDay);
        }

        // 2. Uppdatera alla Chart.js-instanser
        var chartIds = ['progress-chart', 'temp-chart', 'precip-chart', 'flow-chart'];
        chartIds.forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var chartInstance = Chart.getChart(el);
            if (!chartInstance) return;

            chartInstance.options.scales.x.min = xMin;
            chartInstance.options.scales.x.max = xMax;
            chartInstance.update();
        });

        // 3. Uppdatera vinddiagrammet
        var wm = window._windChartMeta;
        if (wm) {
            wm.currentMonth = month;
            wm.ctx.save();
            wm.ctx.setTransform(wm.dpr, 0, 0, wm.dpr, 0, 0);
            wm.drawAll(month);
            wm.ctx.restore();
        }

        // 4. Hantera synlighet för smooth-toggle (bara relevant i helårsvy)
        var smoothLabel = document.getElementById('wind-smooth-label');
        if (smoothLabel) {
            smoothLabel.style.display = (month === 'all') ? 'inline-flex' : 'none';
        }
    }

    function setupGlobalMonthSelector() {
        var sel = document.getElementById('vader-month-select');
        if (sel) {
            sel.onchange = function () {
                setMonthZoom(sel.value);
            };
        }

        var chk = document.getElementById('wind-smooth-toggle');
        if (chk) {
            chk.onchange = function () {
                var wm = window._windChartMeta;
                var m = wm ? wm.currentMonth : 'all';
                if (wm) {
                    wm.ctx.save();
                    wm.ctx.setTransform(wm.dpr, 0, 0, wm.dpr, 0, 0);
                    wm.drawAll(m);
                    wm.ctx.restore();
                }
            };
        }
    }

    // ================================================================
    // CHART 5: Vindkomponenter 4.0 — Hybrid Zoom (År = Stream, Månad = Staplar)
    // ================================================================
    function buildWindChart() {
        var canvas = document.getElementById('wind-chart');
        if (!canvas) return;

        // Vinddiagrammet använder nu den globala månadsväljaren #vader-month-select

        var urlDir = 'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/3/station/' + STATION_TEMP + '/period/latest-months/data.json';
        var urlSpd = 'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/4/station/' + STATION_TEMP + '/period/latest-months/data.json';

        Promise.all([fetch(urlDir).then(function (r) { return r.json(); }), fetch(urlSpd).then(function (r) { return r.json(); })]).then(function (results) {
            var dirVals = results[0].value || [];
            var spdVals = results[1].value || [];

            var spdMap = {};
            spdVals.forEach(function (v) { spdMap[v.date] = parseFloat(v.value) || 0; });

            var startMs = new Date('2026-01-01').getTime();

            // Samla vektor-energi per dag för N/S och V/Ö
            var dayData = {};
            dirVals.forEach(function (v) {
                if (v.date < startMs) return;
                var deg = parseFloat(v.value);
                var spd = spdMap[v.date] || 0;
                if (isNaN(deg) || spd === 0) return;

                var d = new Date(v.date).toISOString().slice(0, 10);
                if (!dayData[d]) dayData[d] = { ns_net: 0, ew_net: 0, count: 0 };

                var rad = deg * Math.PI / 180;
                // deg är varifrån vinden blåser. 0 = N, 90 = Ö, 180 = S, 270 = V

                // Nord/Syd-vektor. cos(0)=1 (Nord), cos(180)=-1 (Syd)
                dayData[d].ns_net += Math.cos(rad) * spd;
                // Öst/Väst-vektor. sin(90)=1 (Öst), sin(270)=-1 (Väst)
                dayData[d].ew_net += Math.sin(rad) * spd;
                dayData[d].count++;
            });

            var days = Object.keys(dayData).sort();
            var ns_raw = [];
            var ew_raw = [];

            days.forEach(function (d) {
                var dd = dayData[d];
                // Positivt för Nord/Öst, Negativt för Syd/Väst
                ns_raw.push(dd.count > 0 ? dd.ns_net / dd.count : 0);
                ew_raw.push(dd.count > 0 ? dd.ew_net / dd.count : 0);
            });

            // Utför en 7-dagars glidande medelvärdes-utjämning (smoothing) för böljande flod-effekt.
            function smooth(arr) {
                var res = [];
                for (var i = 0; i < arr.length; i++) {
                    var sum = 0, cnt = 0;
                    for (var j = Math.max(0, i - 3); j <= Math.min(arr.length - 1, i + 3); j++) {
                        sum += arr[j];
                        cnt++;
                    }
                    res.push(sum / cnt);
                }
                return res;
            }

            var ns_smooth = smooth(ns_raw);
            var ew_smooth = smooth(ew_raw);

            var maxMag = 1;
            ns_smooth.forEach(function (v) { if (Math.abs(v) > maxMag) maxMag = Math.abs(v); });
            ew_smooth.forEach(function (v) { if (Math.abs(v) > maxMag) maxMag = Math.abs(v); });

            var dayIndices = days.map(function (d) {
                var dt = new Date(d);
                var jan1 = new Date(dt.getFullYear(), 0, 1);
                return Math.floor((dt - jan1) / 86400000);
            });

            // === Canvas setup ===
            var dpr = window.devicePixelRatio || 1;
            var w = canvas.parentElement.clientWidth;
            var labelW = 24;
            var chartW = w - labelW;
            var cellW = chartW / 365;

            // Definition av rityta med två distinkta "floder"
            var rowH = window.innerWidth < 600 ? 55 : 90; // Höjd från mitt-axeln
            var gap = 16;
            var bottomPad = 24;

            var base1 = rowH;
            var base2 = (rowH * 3) + gap;
            var h = (rowH * 4) + gap + bottomPad;

            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            var ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // Hjälpfunktion för att rita ett mjuka area-fält med ifylld färggradient (För Helår)
            function drawAreaStream(dataArr, baseY, isPos, r, g, b, startIdx, endIdx) {
                if (dataArr.length === 0) return;
                var sIdx = startIdx !== undefined ? startIdx : 0;
                var eIdx = endIdx !== undefined ? endIdx : dataArr.length - 1;

                // 1. Skapa Path för den fyllda ytan (Area)
                ctx.beginPath();
                ctx.moveTo(labelW + (dayIndices[sIdx] - dayIndices[sIdx]) * cellW, baseY);
                for (var i = sIdx; i <= eIdx; i++) {
                    var val = dataArr[i];
                    var drawVal = isPos ? Math.max(0, val) : Math.max(0, -val);
                    var localX = dayIndices[i] - dayIndices[sIdx];
                    var x = labelW + localX * cellW;
                    var y = baseY + (isPos ? -1 : 1) * (drawVal / maxMag) * (rowH - 4);
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(labelW + (dayIndices[eIdx] - dayIndices[sIdx]) * cellW, baseY);
                ctx.closePath();

                // Translucid Gradient-fill från toppen av vågen mot baslinjen
                var grad = ctx.createLinearGradient(0, baseY + (isPos ? -rowH : rowH), 0, baseY);
                grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.7)');
                grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0.1)');
                ctx.fillStyle = grad;
                ctx.fill();

                // 2. Skapa skarpa kanten överst (Line)
                ctx.beginPath();
                for (var i = sIdx; i <= eIdx; i++) {
                    var val = dataArr[i];
                    var drawVal = isPos ? Math.max(0, val) : Math.max(0, -val);
                    var localX = dayIndices[i] - dayIndices[sIdx];
                    var x = labelW + localX * cellW;
                    var y = baseY + (isPos ? -1 : 1) * (drawVal / maxMag) * (rowH - 4);
                    if (i === sIdx) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',1)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Hjälpfunktion för att rita exakta daggstaplar (För Månadsvy)
            function drawExactBars(dataArr, baseY, isPos, r, g, b, startIdx, endIdx) {
                if (dataArr.length === 0) return;
                var sIdx = startIdx !== undefined ? startIdx : 0;
                var eIdx = endIdx !== undefined ? endIdx : dataArr.length - 1;

                ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',0.85)';
                for (var i = sIdx; i <= eIdx; i++) {
                    var val = dataArr[i];
                    var drawVal = isPos ? Math.max(0, val) : Math.max(0, -val);
                    if (drawVal < 0.1) continue;

                    var localX = dayIndices[i] - dayIndices[sIdx];
                    var x = labelW + localX * cellW;
                    var barH = (drawVal / maxMag) * (rowH - 4);

                    // Om det är en negativ (neråt) stapel drar vi den från baseY, annars uppåt från baseY
                    var rectY = isPos ? baseY - barH : baseY;
                    ctx.fillRect(x, rectY, Math.ceil(cellW) + 0.5, barH);
                }
            }

            // Ritar hela diagrammet (återanvänds vid redraw, highlights, och månad-zoom)
            // 'zoomMonth' är en sträng t.ex. '2026-05' eller 'all'
            var drawAll = function (zoomMonth, hlStartIdx, hlEndIdx) {
                zoomMonth = zoomMonth || 'all';

                // Hitta start- och slutindex för den valda perioden
                var sIdx = 0, eIdx = days.length - 1;
                var timeframeDays = 365;

                if (zoomMonth !== 'all') {
                    // Filtrera fram första och sista index för månaden
                    var mIdxs = [];
                    for (var i = 0; i < days.length; i++) {
                        if (days[i].startsWith(zoomMonth)) mIdxs.push(i);
                    }
                    if (mIdxs.length > 0) {
                        sIdx = mIdxs[0];
                        eIdx = mIdxs[mIdxs.length - 1];
                    } else {
                        // Ingen data för denna månad (framtid) — rita tomt diagram
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, w, h);
                        cellW = chartW / timeframeDays;
                        ctx.fillStyle = 'rgba(0,0,0,0.015)';
                        ctx.fillRect(labelW, 0, chartW, rowH * 2);
                        ctx.fillRect(labelW, rowH * 2 + gap, chartW, rowH * 2);
                        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(labelW, base1); ctx.lineTo(w, base1); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(labelW, base2); ctx.lineTo(w, base2); ctx.stroke();
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                        ctx.font = 'bold 11px Inter, sans-serif'; ctx.fillStyle = '#333';
                        ctx.fillText('N', labelW - 6, base1 - rowH / 2);
                        ctx.fillText('S', labelW - 6, base1 + rowH / 2);
                        ctx.fillText('Ö', labelW - 6, base2 - rowH / 2);
                        ctx.fillText('V', labelW - 6, base2 + rowH / 2);
                        // Visa "Ingen data" centrerat
                        ctx.textAlign = 'center'; ctx.font = '12px Inter, sans-serif';
                        ctx.fillStyle = '#999';
                        ctx.fillText('Ingen vinddata för denna period', w / 2, h / 2);
                        return;
                    }
                    // Månader är runt 30 dagar. Vi uppdaterar draw-skalan
                    timeframeDays = new Date(zoomMonth.substring(0, 4), parseInt(zoomMonth.substring(5, 7)), 0).getDate();
                }

                // Uppdatera cellW temporärt baserat på inzoomningen
                cellW = chartW / timeframeDays;

                // Läs state från knappen
                var smoothCheckbox = document.getElementById('wind-smooth-toggle');
                var isSmoothChecked = smoothCheckbox ? smoothCheckbox.checked : true;

                // Hantera synlighet för "Jämna ut data" etiketten
                var smoothLabel = document.getElementById('wind-smooth-label');
                if (smoothLabel) {
                    if (zoomMonth === 'all') {
                        smoothLabel.style.display = 'inline-flex';
                    } else {
                        smoothLabel.style.display = 'none';
                    }
                }

                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, w, h);

                // Rita Gul Highlight först (om aktiv)
                if (hlStartIdx !== undefined && hlEndIdx !== undefined) {
                    var hx1 = labelW + (hlStartIdx - dayIndices[sIdx]) * cellW;
                    var hx2 = labelW + (hlEndIdx - dayIndices[sIdx] + 1) * cellW;

                    // Klipp highlighten så den inte ritar utanför grafen om den går över månadsskiftet
                    hx1 = Math.max(labelW, Math.min(w, hx1));
                    hx2 = Math.max(labelW, Math.min(w, hx2));

                    if (hx2 > hx1) {
                        ctx.fillStyle = 'rgba(255, 235, 59, 0.3)';
                        ctx.fillRect(hx1, 0, hx2 - hx1, h - bottomPad);
                        ctx.strokeStyle = 'rgba(255, 193, 7, 0.6)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(hx1, 0, hx2 - hx1, h - bottomPad);
                    }
                }

                // Bakgrunder för diagramzoner
                ctx.fillStyle = 'rgba(0,0,0,0.015)';
                ctx.fillRect(labelW, 0, chartW, rowH * 2);
                ctx.fillRect(labelW, rowH * 2 + gap, chartW, rowH * 2);

                // Baslinjer för axlarna = 0 markeringarna
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;

                ctx.beginPath(); ctx.moveTo(labelW, base1); ctx.lineTo(w, base1); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(labelW, base2); ctx.lineTo(w, base2); ctx.stroke();

                // Hybrid Render Logic
                // Om vi tittar på en kortare period (t.ex. < 90 dagar / en månad), ELLER om smoothing är avstängt, rita exakta staplar.
                // Annars: Rita Flowing Stream (medelvärdeskurvan).
                var shouldSmooth = (timeframeDays >= 90) && isSmoothChecked;

                if (!shouldSmooth) {
                    drawExactBars(ns_raw, base1, true, 70, 130, 180, sIdx, eIdx); // Nord (Blå)
                    drawExactBars(ns_raw, base1, false, 205, 92, 92, sIdx, eIdx);  // Syd (Röd)
                    drawExactBars(ew_raw, base2, true, 123, 104, 174, sIdx, eIdx);  // Öst (Mjuk lila)
                    drawExactBars(ew_raw, base2, false, 212, 160, 48, sIdx, eIdx); // Väst (Guld)
                } else {
                    drawAreaStream(ns_smooth, base1, true, 70, 130, 180, sIdx, eIdx); // Nord (Blå)
                    drawAreaStream(ns_smooth, base1, false, 205, 92, 92, sIdx, eIdx);  // Syd (Röd)
                    drawAreaStream(ew_smooth, base2, true, 123, 104, 174, sIdx, eIdx);  // Öst (Mjuk lila)
                    drawAreaStream(ew_smooth, base2, false, 212, 160, 48, sIdx, eIdx); // Väst (Guld)
                }

                // Etiketter vid axlarnas startpunkt
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 11px Inter, sans-serif';
                ctx.fillStyle = '#333';

                // Axel 1
                ctx.fillText('N', labelW - 6, base1 - rowH / 2);
                ctx.fillText('S', labelW - 6, base1 + rowH / 2);

                // Axel 2
                ctx.fillText('Ö', labelW - 6, base2 - rowH / 2);
                ctx.fillText('V', labelW - 6, base2 + rowH / 2);

                // Månadslinjer / Dagslinjer
                ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                ctx.lineWidth = 0.5;
                ctx.textAlign = 'center';
                ctx.font = '9px Inter, sans-serif';
                ctx.fillStyle = '#999';

                if (zoomMonth === 'all') {
                    var monthStarts = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
                    for (var m = 0; m < 12; m++) {
                        var mx = labelW + monthStarts[m] * cellW;
                        ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, h - bottomPad); ctx.stroke();
                    }
                } else {
                    // Rita ut dagslinjer för inzoomad månad var femte dag
                    for (var d = 0; d < timeframeDays; d++) {
                        if (d % 5 === 0 || d === timeframeDays - 1) {
                            var mx = labelW + d * cellW;
                            ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, h - bottomPad); ctx.stroke();
                            ctx.fillText((d + 1) + '', mx, h - 10);
                        }
                    }
                }

                // Legend minimalistsk design
                var legX = labelW + 10;
                var legY = 6;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(legX - 4, legY - 4, 150, 18);

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.font = '9px Inter, sans-serif';
                ctx.fillStyle = '#4682B4'; ctx.fillText('Nord: Blå', legX, legY);
                ctx.fillStyle = '#CD5C5C'; ctx.fillText('Syd: Röd', legX + 45, legY);
                ctx.fillStyle = '#7B68AE'; ctx.fillText('Öst: Lila', legX + 90, legY);
                ctx.fillStyle = '#D4A030'; ctx.fillText('Väst: Guld', legX + 135, legY);
            };

            // Event-bindning sköts nu av setupGlobalMonthSelector()

            drawAll('all');

            window._windChartMeta = {
                canvas: canvas, ctx: ctx, dpr: dpr, w: w, h: h,
                drawAll: drawAll, dayIndices: dayIndices, currentMonth: 'all'
            };
        }).catch(function (error) {
            console.error('Error fetching wind data:', error);
            var el = document.getElementById('wind-chart');
            if (el) el.parentElement.innerHTML = '<p class="vader-chart-error">Vinddata kunde inte laddas</p>';
        });
    }

    // ================================================================
    // FÄLT­RAPPORT-VÄLJARE: Dropdown + excerpt med datummarkering
    // ================================================================
    function buildBlogDropdown() {
        var sel = document.getElementById('vader-blog-select');
        var preview = document.getElementById('vader-blog-preview');
        if (!sel || !blogPosts || blogPosts.length === 0) return;

        // Sortera nyast först
        var sorted = blogPosts.slice().sort(function (a, b) {
            return a.date > b.date ? -1 : a.date < b.date ? 1 : 0;
        });

        var months = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

        sorted.forEach(function (p, i) {
            var d = new Date(p.date);
            var label = d.getDate() + ' ' + months[d.getMonth()] + ' — ' + p.title;
            var opt = document.createElement('option');
            opt.value = i;
            opt.textContent = label;
            sel.appendChild(opt);
        });

        sel.addEventListener('change', function () {
            if (sel.value === '') {
                // Default: helår, ingen highlight
                preview.style.display = 'none';
                clearHighlights();
                // Återställ globala månadsväljaren till helår
                var monthSel = document.getElementById('vader-month-select');
                if (monthSel) { monthSel.value = 'all'; }
                setMonthZoom('all');
                return;
            }

            var post = sorted[parseInt(sel.value)];
            if (!post) return;

            // Visa excerpt
            preview.innerHTML =
                '<strong>' + post.title + '</strong>' +
                '<p class="vader-blog-excerpt">' + post.excerpt + '</p>' +
                '<a href="' + post.url + '" class="vader-blog-link">Läs hela fältrapporten →</a>';
            preview.style.display = 'block';

            // Highlighta datumet i alla diagram
            highlightDateRange(post.date, post.date);
        });
    }

    // Alla Chart.js-instanser sparas för highlighting
    var _chartInstances = [];
    var _origNewChart = Chart;
    // Wrappa Chart-konstruktorn för att spara instanser
    (function () {
        var origProto = Chart.prototype;
        var origConstructor = Chart;
    })();

    function highlightDateRange(from, to) {
        clearHighlights();

        // Hitta alla Chart.js canvases och lägg till annotation
        var chartCanvases = ['progress-chart', 'temp-chart', 'precip-chart', 'flow-chart'];
        chartCanvases.forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var chartInstance = Chart.getChart(el);
            if (!chartInstance) return;

            // Lägg till highlight-annotation
            chartInstance.options.plugins.annotation.annotations.highlight = {
                type: 'box',
                xMin: from,
                xMax: to + 'T23:59:59',
                backgroundColor: 'rgba(255, 235, 59, 0.25)',
                borderColor: 'rgba(255, 193, 7, 0.5)',
                borderWidth: 1,
                borderRadius: 2
            };
            chartInstance.update('none');
        });

        // Auto-zooma alla diagram till månaden
        var targetMonth = from.substring(0, 7); // t.ex. '2026-02'
        var monthSel = document.getElementById('vader-month-select');
        if (monthSel) monthSel.value = targetMonth;
        setMonthZoom(targetMonth);

        // Highlight vindrastret med extra highlight-markeringar
        var wm = window._windChartMeta;
        if (wm) {
            var fromDate = new Date(from);
            var toDate = new Date(to);
            var jan1 = new Date(fromDate.getFullYear(), 0, 1);
            var fromIdx = Math.floor((fromDate - jan1) / 86400000);
            var toIdx = Math.floor((toDate - jan1) / 86400000);
            wm.ctx.save();
            wm.ctx.setTransform(wm.dpr, 0, 0, wm.dpr, 0, 0);
            wm.drawAll(targetMonth, fromIdx, toIdx);
            wm.ctx.restore();
        }

        // Scrolla mjukt till diagrammen
        var triptych = document.querySelector('.vader-triptych');
        if (triptych) triptych.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function clearHighlights() {
        var chartCanvases = ['progress-chart', 'temp-chart', 'precip-chart', 'flow-chart'];
        chartCanvases.forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var chartInstance = Chart.getChart(el);
            if (!chartInstance) return;
            delete chartInstance.options.plugins.annotation.annotations.highlight;
            chartInstance.update('none');
        });

        // Redraw vindraster utan highlight
        var wm = window._windChartMeta;
        if (wm) {
            wm.ctx.save();
            wm.ctx.setTransform(wm.dpr, 0, 0, wm.dpr, 0, 0);
            wm.drawAll(wm.currentMonth);
            wm.ctx.restore();
        }
    }

    // Bygg dropdown efter DOM är redo
    buildBlogDropdown();

</script>
