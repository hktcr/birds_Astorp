{{ define "main" }}
<section class="vader-page">
    <div class="vader-container">

        <h1 class="vader-title">{{ .Title }}</h1>

        <div class="vader-intro">
            {{ .Content }}
        </div>

        <!-- Kvartett: fyra diagram vertikalt -->
        <div class="vader-triptych">

            <!-- 1. Artprogress -->
            <div class="vader-chart-card">
                <h2 class="vader-chart-label">Årslistan</h2>
                <div class="vader-chart-wrap">
                    <canvas id="progress-chart"></canvas>
                </div>
            </div>

            <!-- 2. Temperatur -->
            <div class="vader-chart-card">
                <h2 class="vader-chart-label">Temperatur</h2>
                <div class="vader-chart-wrap">
                    <canvas id="temp-chart"></canvas>
                </div>
                <p class="vader-chart-source">SMHI, Helsingborg A</p>
            </div>

            <!-- 3. Nederbörd -->
            <div class="vader-chart-card">
                <h2 class="vader-chart-label">Nederbörd</h2>
                <div class="vader-chart-wrap">
                    <canvas id="precip-chart"></canvas>
                </div>
                <p class="vader-chart-source">SMHI, Åstorp</p>
            </div>

            <!-- 4. Vattenföring -->
            <div class="vader-chart-card">
                <h2 class="vader-chart-label">Vattenföring</h2>
                <div class="vader-chart-wrap">
                    <canvas id="flow-chart"></canvas>
                </div>
                <p class="vader-chart-source">SMHI, Åbromölla</p>
            </div>

            <!-- 5. Vindraster -->
            <div class="vader-chart-card">
                <h2 class="vader-chart-label">Vind</h2>
                <div class="vader-chart-wrap vader-wind-wrap">
                    <canvas id="wind-chart"></canvas>
                </div>
                <p class="vader-chart-source">SMHI, Helsingborg A</p>
            </div>

        </div>

    </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
<script>
    var YEAR_GOAL = 150;

    // Observationsdata (inbäddad vid byggtid)
    var data = {{ index .Site.Data "checklist-2026" | jsonify | safeJS }};

    // SMHI-stationer
    var STATION_TEMP = 62040;   // Helsingborg A (param 19 & 20)
    var STATION_PRECIP = 62060; // Åstorp (param 5)
    var STATION_FLOW = 2196;    // Åbromölla (vattenföring)

    // Gemensam x-axelkonfiguration
    var timeScaleConfig = {
        type: 'time',
        time: {
            unit: 'month',
            displayFormats: { month: 'MMM' },
            tooltipFormat: 'd MMM yyyy'
        },
        min: '2026-01-01',
        max: '2026-12-31',
        grid: {
            color: 'rgba(0,0,0,0.06)',
            drawTicks: false
        },
        border: { dash: [4, 4] },
        ticks: {
            font: { family: 'Inter', size: 11 },
            color: '#666'
        }
    };

    // ================================================================
    // CHART 1: Artprogress
    // ================================================================
    function buildProgressChart() {
        var canvas = document.getElementById('progress-chart');
        if (!canvas || !data || !data.observations) return;

        var seen = {};
        var cumulative = [];
        var sorted = data.observations.slice().sort(function (a, b) {
            return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
        });
        sorted.forEach(function (obs) {
            if (!seen[obs.species]) {
                seen[obs.species] = true;
                cumulative.push({ x: obs.date, y: Object.keys(seen).length });
            }
        });

        // Förläng linjen till idag
        var today = new Date().toISOString().slice(0, 10);
        if (cumulative.length > 0 && cumulative[cumulative.length - 1].x < today) {
            cumulative.push({ x: today, y: cumulative[cumulative.length - 1].y });
        }

        var startDate = cumulative.length > 0 ? cumulative[0].x : '2026-01-22';

        new Chart(canvas, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Antal arter',
                    data: cumulative,
                    borderColor: '#C0392B',
                    backgroundColor: function (ctx) {
                        var chart = ctx.chart;
                        var area = chart.chartArea;
                        if (!area) return 'rgba(192, 57, 43, 0.08)';
                        var gradient = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
                        gradient.addColorStop(0, 'rgba(192, 57, 43, 0.15)');
                        gradient.addColorStop(1, 'rgba(192, 57, 43, 0.01)');
                        return gradient;
                    },
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    pointHitRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                aspectRatio: window.innerWidth < 600 ? 1.6 : 2.5,
                scales: {
                    x: JSON.parse(JSON.stringify(timeScaleConfig)),
                    y: {
                        min: 0,
                        max: 170,
                        grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
                        ticks: {
                            stepSize: 25,
                            font: { family: 'Inter', size: 11 },
                            color: '#666'
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(30,66,32,0.9)',
                        titleFont: { family: 'Inter' },
                        bodyFont: { family: 'Inter' },
                        callbacks: {
                            label: function (ctx) { return ctx.parsed.y + ' arter'; }
                        }
                    },
                    annotation: {
                        annotations: {
                            goalLine: {
                                type: 'line',
                                yMin: YEAR_GOAL,
                                yMax: YEAR_GOAL,
                                borderColor: 'rgba(192, 57, 43, 0.4)',
                                borderWidth: 1.5,
                                borderDash: [6, 4],
                                label: {
                                    display: true,
                                    content: 'Mål: ' + YEAR_GOAL + ' arter',
                                    position: 'end',
                                    backgroundColor: 'rgba(192, 57, 43, 0.8)',
                                    color: '#fff',
                                    font: { family: 'Inter', size: 11, weight: '500' },
                                    padding: { top: 3, bottom: 3, left: 6, right: 6 },
                                    borderRadius: 4
                                }
                            },
                            startPoint: {
                                type: 'point',
                                xValue: startDate,
                                yValue: 1,
                                radius: 5,
                                backgroundColor: '#C0392B',
                                borderColor: '#fff',
                                borderWidth: 2
                            }
                        }
                    }
                }
            }
        });
    }

    // ================================================================
    // CHART 2: Temperatur — dag-max (orange) & natt-min (blå)
    // ================================================================
    function fetchSMHI(param, station) {
        var url = 'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/' +
            param + '/station/' + station + '/period/latest-months/data.json';
        return fetch(url).then(function (r) { return r.json(); });
    }

    function buildTempChart() {
        var canvas = document.getElementById('temp-chart');
        if (!canvas) return;

        Promise.all([fetchSMHI(19, STATION_TEMP), fetchSMHI(20, STATION_TEMP)]).then(function (results) {
            var minData = results[0].value || [];
            var maxData = results[1].value || [];

            var minPoints = [];
            var maxPoints = [];
            minData.forEach(function (v) {
                if (v.ref >= '2026-01-01') minPoints.push({ x: v.ref, y: parseFloat(v.value) });
            });
            maxData.forEach(function (v) {
                if (v.ref >= '2026-01-01') maxPoints.push({ x: v.ref, y: parseFloat(v.value) });
            });

            new Chart(canvas, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Dag (max)',
                            data: maxPoints,
                            borderColor: '#E67E22',
                            backgroundColor: 'rgba(230, 126, 34, 0.06)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 0,
                            pointHitRadius: 8
                        },
                        {
                            label: 'Natt (min)',
                            data: minPoints,
                            borderColor: '#2C3E82',
                            backgroundColor: 'rgba(44, 62, 130, 0.06)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 0,
                            pointHitRadius: 8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: window.innerWidth < 600 ? 1.4 : 2.0,
                    scales: {
                        x: JSON.parse(JSON.stringify(timeScaleConfig)),
                        y: {
                            grid: {
                                color: function (ctx) {
                                    return ctx.tick.value === 0 ? 'rgba(0,0,0,0.15)' : 'rgba(0,0,0,0.04)';
                                },
                                drawTicks: false
                            },
                            ticks: {
                                callback: function (v) { return v + '°'; },
                                font: { family: 'Inter', size: 11 },
                                color: '#666'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            align: 'end',
                            labels: {
                                usePointStyle: true,
                                pointStyle: 'line',
                                font: { family: 'Inter', size: 11 },
                                color: '#555',
                                padding: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30,66,32,0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            callbacks: {
                                label: function (ctx) {
                                    return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '°C';
                                }
                            }
                        },
                        annotation: {
                            annotations: {
                                zeroLine: {
                                    type: 'line',
                                    yMin: 0, yMax: 0,
                                    borderColor: 'rgba(0,0,0,0.15)',
                                    borderWidth: 1,
                                    borderDash: [3, 3]
                                }
                            }
                        }
                    }
                }
            });
        }).catch(function (err) {
            console.warn('Kunde inte hämta temperaturdata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Temperaturdata kunde inte laddas</p>';
        });
    }

    // ================================================================
    // CHART 3: Nederbörd — blå staplar per dag
    // ================================================================
    function buildPrecipChart() {
        var canvas = document.getElementById('precip-chart');
        if (!canvas) return;

        fetchSMHI(5, STATION_PRECIP).then(function (result) {
            var vals = result.value || [];
            var points = [];
            vals.forEach(function (v) {
                if (v.ref >= '2026-01-01') {
                    points.push({ x: v.ref, y: parseFloat(v.value) });
                }
            });

            new Chart(canvas, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Nederbörd',
                        data: points,
                        backgroundColor: 'rgba(52, 152, 219, 0.6)',
                        borderColor: 'rgba(52, 152, 219, 0.9)',
                        borderWidth: 1,
                        borderRadius: 2,
                        barPercentage: 0.9,
                        categoryPercentage: 0.9
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: window.innerWidth < 600 ? 1.6 : 2.5,
                    scales: {
                        x: JSON.parse(JSON.stringify(timeScaleConfig)),
                        y: {
                            min: 0,
                            grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
                            ticks: {
                                callback: function (v) { return v + ' mm'; },
                                font: { family: 'Inter', size: 11 },
                                color: '#666'
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30,66,32,0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            callbacks: {
                                label: function (ctx) {
                                    return ctx.parsed.y.toFixed(1) + ' mm';
                                }
                            }
                        }
                    }
                }
            });
        }).catch(function (err) {
            console.warn('Kunde inte hämta nederbördsdata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Nederbördsdata kunde inte laddas</p>';
        });
    }

    // ================================================================
    // CHART 4: Vattenföring — linjediagram (m³/s)
    // ================================================================
    function buildFlowChart() {
        var canvas = document.getElementById('flow-chart');
        if (!canvas) return;


        var url = 'https://opendata-download-hydroobs.smhi.se/api/version/latest/parameter/1/station/' +
            STATION_FLOW + '/period/corrected-archive/data.json';

        fetch(url).then(function (r) { return r.json(); }).then(function (result) {
            var vals = result.value || [];
            var startMs = new Date('2026-01-01').getTime();

            // Aggregera till dagsvärden (medel per dag)
            var dayMap = {};
            vals.forEach(function (v) {
                if (v.date >= startMs) {
                    var d = new Date(v.date).toISOString().slice(0, 10);
                    if (!dayMap[d]) dayMap[d] = { sum: 0, count: 0 };
                    dayMap[d].sum += v.value;
                    dayMap[d].count++;
                }
            });

            var points = Object.keys(dayMap).sort().map(function (d) {
                return { x: d, y: Math.round(dayMap[d].sum / dayMap[d].count * 100) / 100 };
            });

            new Chart(canvas, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Vattenföring',
                        data: points,
                        borderColor: '#1ABC9C',
                        backgroundColor: function (ctx) {
                            var chart = ctx.chart;
                            var area = chart.chartArea;
                            if (!area) return 'rgba(26, 188, 156, 0.08)';
                            var gradient = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
                            gradient.addColorStop(0, 'rgba(26, 188, 156, 0.2)');
                            gradient.addColorStop(1, 'rgba(26, 188, 156, 0.01)');
                            return gradient;
                        },
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHitRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: window.innerWidth < 600 ? 1.6 : 2.5,
                    scales: {
                        x: JSON.parse(JSON.stringify(timeScaleConfig)),
                        y: {
                            min: 0,
                            grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
                            ticks: {
                                callback: function (v) { return v + ' m\u00B3/s'; },
                                font: { family: 'Inter', size: 11 },
                                color: '#666'
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30,66,32,0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            callbacks: {
                                label: function (ctx) {
                                    return ctx.parsed.y.toFixed(2) + ' m\u00B3/s';
                                }
                            }
                        }
                    }
                }
            });
        }).catch(function (err) {
            console.warn('Kunde inte hämta vattenföringsdata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Vattenföringsdata kunde inte laddas</p>';
        });
    }

    // Ladda Luxon time adapter, sedan bygg alla diagram
    (function () {
        var s1 = document.createElement('script');
        s1.src = 'https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js';
        s1.onload = function () {
            var s2 = document.createElement('script');
            s2.src = 'https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1';
            s2.onload = function () {
                buildProgressChart();
                buildTempChart();
                buildPrecipChart();
                buildFlowChart();
                buildWindChart();
            };
            document.head.appendChild(s2);
        };
        document.head.appendChild(s1);
    })();

    // ================================================================
    // CHART 5: Vindraster — 8 sektorer × dagar, Canvas 2D
    // ================================================================
    function buildWindChart() {
        var canvas = document.getElementById('wind-chart');
        if (!canvas) return;

        // Sektorer: S längst ner, medurs uppåt
        var sectors = ['S', 'SV', 'V', 'NV', 'N', 'NO', 'O', 'SO'];
        var sectorMid = [180, 225, 270, 315, 0, 45, 90, 135];

        // Kontrasterande färgpalett (SW↔NE, S↔N, W↔E, NW↔SE)
        var sectorColors = {
            'S': { r: 205, g: 92, b: 92 },  // Coral
            'SV': { r: 218, g: 145, b: 32 },  // Amber
            'V': { r: 196, g: 164, b: 50 },  // Gold
            'NV': { r: 46, g: 139, b: 110 },  // Emerald
            'N': { r: 70, g: 130, b: 180 },  // Steel blue
            'NO': { r: 136, g: 100, b: 168 },  // Violet
            'O': { r: 56, g: 163, b: 155 },  // Teal
            'SO': { r: 180, g: 90, b: 130 }   // Rose
        };

        function classifySector(deg) {
            deg = ((deg % 360) + 360) % 360;
            // Varje sektor = 45°, centrerad på sectorMid
            for (var i = 0; i < sectorMid.length; i++) {
                var mid = sectorMid[i];
                var lo = ((mid - 22.5) + 360) % 360;
                var hi = (mid + 22.5) % 360;
                if (lo > hi) { // Wraps around 0
                    if (deg >= lo || deg < hi) return i;
                } else {
                    if (deg >= lo && deg < hi) return i;
                }
            }
            return 0;
        }

        // Hämta vindriktning (param 3) och vindhastighet (param 4)
        var urlDir = 'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/3/station/' + STATION_TEMP + '/period/latest-months/data.json';
        var urlSpd = 'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/4/station/' + STATION_TEMP + '/period/latest-months/data.json';

        Promise.all([fetch(urlDir).then(function (r) { return r.json(); }), fetch(urlSpd).then(function (r) { return r.json(); })]).then(function (results) {
            var dirVals = results[0].value || [];
            var spdVals = results[1].value || [];

            // Bygg snabb-lookup för hastighet per timestamp
            var spdMap = {};
            spdVals.forEach(function (v) { spdMap[v.date] = parseFloat(v.value) || 0; });

            var startMs = new Date('2026-01-01').getTime();
            var endMs = new Date('2026-12-31').getTime();

            // Samla data per dag
            var dayData = {};  // { 'YYYY-MM-DD': { sector_counts: [8], sector_speeds: [8] } }
            dirVals.forEach(function (v) {
                if (v.date < startMs) return;
                var deg = parseFloat(v.value);
                var spd = spdMap[v.date] || 0;
                if (isNaN(deg)) return;

                var d = new Date(v.date).toISOString().slice(0, 10);
                if (!dayData[d]) {
                    dayData[d] = {
                        counts: [0, 0, 0, 0, 0, 0, 0, 0],
                        speeds: [0, 0, 0, 0, 0, 0, 0, 0]
                    };
                }
                var si = classifySector(deg);
                dayData[d].counts[si]++;
                dayData[d].speeds[si] += spd;
            });

            // Beräkna energi per sektor per dag: (andel timmar) × medelhastighet
            var days = Object.keys(dayData).sort();
            var maxEnergy = 0;
            var energyGrid = [];  // [dayIndex][sectorIndex] = energy

            days.forEach(function (d) {
                var dd = dayData[d];
                var totalObs = 0;
                dd.counts.forEach(function (c) { totalObs += c; });
                var row = [];
                for (var s = 0; s < 8; s++) {
                    var freq = totalObs > 0 ? dd.counts[s] / totalObs : 0;
                    var meanSpd = dd.counts[s] > 0 ? dd.speeds[s] / dd.counts[s] : 0;
                    var energy = freq * meanSpd;
                    if (energy > maxEnergy) maxEnergy = energy;
                    row.push(energy);
                }
                energyGrid.push(row);
            });

            // Beräkna dag-index för hela året (0 = 1 jan, 364 = 31 dec)
            var dayIndices = days.map(function (d) {
                var dt = new Date(d);
                var jan1 = new Date(dt.getFullYear(), 0, 1);
                return Math.floor((dt - jan1) / 86400000);
            });

            // Canvas setup
            var dpr = window.devicePixelRatio || 1;
            var w = canvas.parentElement.clientWidth;
            var labelW = 30;  // Utrymme för sektor-labels
            var chartW = w - labelW;
            var cellH = window.innerWidth < 600 ? 14 : 18;
            var h = cellH * 8 + 2;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            var ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // Bakgrund
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, w, h);

            // Rita celler
            var cellW = chartW / 365;
            for (var di = 0; di < days.length; di++) {
                var xi = dayIndices[di];
                var x = labelW + xi * cellW;
                for (var si = 0; si < 8; si++) {
                    var energy = energyGrid[di][si];
                    var alpha = maxEnergy > 0 ? Math.min(energy / maxEnergy, 1) : 0;
                    // Sätt minimum-alpha så att noll-vind är helt transparent
                    alpha = Math.pow(alpha, 0.6);  // Gamma-korrigering för att få bra kontrast
                    var c = sectorColors[sectors[si]];
                    var y = h - (si + 1) * cellH;  // S längst ner
                    ctx.fillStyle = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha.toFixed(3) + ')';
                    ctx.fillRect(x, y, Math.ceil(cellW) + 0.5, cellH - 1);
                }
            }

            // Sektor-labels (å vänster)
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.font = '10px Inter, sans-serif';
            ctx.fillStyle = '#888';
            for (var si = 0; si < 8; si++) {
                var y = h - (si + 0.5) * cellH;
                ctx.fillText(sectors[si], labelW - 4, y);
            }

            // Månadslinjer
            ctx.strokeStyle = 'rgba(0,0,0,0.08)';
            ctx.lineWidth = 0.5;
            var monthStarts = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Maj', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
            ctx.textAlign = 'center';
            ctx.font = '9px Inter, sans-serif';
            ctx.fillStyle = '#999';
            for (var m = 0; m < 12; m++) {
                var mx = labelW + monthStarts[m] * cellW;
                ctx.beginPath();
                ctx.moveTo(mx, 0);
                ctx.lineTo(mx, h);
                ctx.stroke();
            }

        }).catch(function (err) {
            console.warn('Kunde inte h\u00e4mta vinddata:', err);
            canvas.parentElement.innerHTML = '<p class="vader-chart-error">Vinddata kunde inte laddas</p>';
        });
    }

</script>
{{ end }}
