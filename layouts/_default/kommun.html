{{ define "main" }}
<section class="kommun-page">
    <div class="kommun-container">

        <!-- Rubrik + intro (lätt stil som startsidan) -->
        <div class="kommun-header">
            <h1 class="kommun-title">{{ .Title }}</h1>
            <div class="kommun-intro">{{ .Content }}</div>
            <div class="kommun-stats-row" id="kommun-stats-row">
                <span class="kommun-stat-pill"><strong id="stat-observers">—</strong> observatörer</span>
                <span class="kommun-stat-pill"><strong id="stat-species">—</strong> arter</span>
                <span class="kommun-stat-pill"><strong id="stat-observations">—</strong> rapporter</span>
            </div>
        </div>

        <!-- Sök/filter -->
        <div class="kommun-filter-bar" id="kommun-filter-bar" style="display:none;">
            <input type="text" id="kommun-search" class="kommun-search-input" placeholder="Sök observatör…" autocomplete="off">
            <div class="kommun-sort-controls">
                <button class="kommun-sort-btn" data-sort="name">Namn ↕</button>
                <button class="kommun-sort-btn active" data-sort="species">Arter ↕</button>
                <button class="kommun-sort-btn" data-sort="count">Rapporter ↕</button>
                <button class="kommun-sort-btn" data-sort="date">Senast ↕</button>
            </div>
        </div>

        <!-- Laddningsindikator -->
        <div class="kommun-loading" id="kommun-loading">
            <div class="kommun-spinner"></div>
            <span>Hämtar observationer…</span>
        </div>

        <!-- Felmeddelande -->
        <div class="kommun-error" id="kommun-error" style="display:none;">
            <span>⚠️ Kunde inte hämta data. Försök ladda om sidan.</span>
        </div>

        <!-- Observatörslista -->
        <div id="kommun-observer-list" style="display:none;">
            <div id="kommun-cards"></div>
        </div>

        <!-- Datakälla -->
        <div class="kommun-source" id="kommun-source" style="display:none;">
            Data: <a href="https://www.artportalen.se" target="_blank" rel="noopener">Artportalen</a> via
            <a href="https://api-portal.artdatabanken.se" target="_blank" rel="noopener">SLU Artdatabankens API</a>
            · <span id="kommun-timestamp"></span>
        </div>

    </div>
</section>

<!-- Krysslista-modal -->
<div class="kommun-modal-overlay" id="kommun-modal" style="display:none;">
    <div class="kommun-modal">
        <button class="kommun-modal-close" id="kommun-modal-close">&times;</button>
        <h2 class="kommun-modal-title" id="kommun-modal-title"></h2>
        <p class="kommun-modal-subtitle" id="kommun-modal-subtitle"></p>
        <div class="kommun-modal-sort">
            <button class="kommun-modal-sort-btn active" data-modal-sort="date">Kronologisk</button>
            <button class="kommun-modal-sort-btn" data-modal-sort="taxonomy">Taxonomisk</button>
        </div>
        <div class="kommun-modal-list" id="kommun-modal-list"></div>
    </div>
</div>
{{ end }}

{{ define "scripts" }}
<script>
(function() {
    // ── Config ─────────────────────────────────────────────
    var API_BASE = 'https://api.artdatabanken.se/species-observation-system/v1';
    var API_KEY = '328d49c810214ebe9098321dffcac80e';
    var MY_NAME = 'Håkan Karlsson';
    var YEAR = 2026;
    var MUNICIPALITY_ID = '1277';
    var TAXON_BIRDS = 4000104;

    // ── State ──────────────────────────────────────────────
    var allObserverData = [];
    var currentSort = { field: 'species', asc: false };

    // ── API-hämtning ───────────────────────────────────────
    function fetchAllObservations() {
        var allRecords = [];
        var skip = 0;
        var take = 1000;

        function fetchPage() {
            var body = {
                taxon: { ids: [TAXON_BIRDS], includeUnderlyingTaxa: true },
                geographics: { areas: [{ areaType: 'Municipality', featureId: MUNICIPALITY_ID }] },
                date: {
                    startDate: YEAR + '-01-01',
                    endDate: YEAR + '-12-31',
                    dateFilterType: 'BetweenStartDateAndEndDate'
                },
                output: {
                    fieldSet: 'Minimum',
                    fields: ['occurrence.reportedBy', 'occurrence.recordedBy']
                }
            };

            return fetch(API_BASE + '/Observations/Search?skip=' + skip + '&take=' + take + '&translationCultureCode=sv-SE', {
                method: 'POST',
                headers: {
                    'Ocp-Apim-Subscription-Key': API_KEY,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(body)
            })
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(data) {
                var records = data.records || data;
                if (!Array.isArray(records)) records = [];
                allRecords = allRecords.concat(records);
                skip += records.length;
                if (records.length === take) return fetchPage();
                return allRecords;
            });
        }
        return fetchPage();
    }

    function fetchMyChecklist() {
        return fetch('/data/checklist-' + YEAR + '.json')
            .then(function(r) { return r.json(); })
            .then(function(data) { return data.observations || []; });
    }

    // ── Bearbetning ────────────────────────────────────────
    function processObservations(records, myObs) {
        var filtered = records.filter(function(obs) {
            var occ = obs.occurrence || {};
            return (occ.reportedBy || '') !== MY_NAME && (occ.recordedBy || '') !== MY_NAME;
        });

        var observerMap = {};
        var allSpeciesSet = {};

        filtered.forEach(function(obs) {
            var taxon = obs.taxon || {};
            var occ = obs.occurrence || {};
            var event = obs.event || {};
            var speciesName = taxon.vernacularName || taxon.scientificName || '?';
            var reporter = occ.reportedBy || occ.recordedBy || 'Okänd';
            var date = (event.plainStartDate || event.startDate || '').substring(0, 10);
            if (!taxon.id) return;
            allSpeciesSet[speciesName] = true;

            if (!observerMap[reporter]) {
                observerMap[reporter] = { name: reporter, species: {}, count: 0, latestDate: '', isMe: false };
            }
            var ob = observerMap[reporter];
            if (!ob.species[speciesName]) {
                ob.species[speciesName] = { name: speciesName, firstDate: date };
            } else if (date < ob.species[speciesName].firstDate) {
                ob.species[speciesName].firstDate = date;
            }
            ob.count++;
            if (date > ob.latestDate) ob.latestDate = date;
        });

        // Håkan from local checklist
        var myEntry = { name: MY_NAME, species: {}, count: 0, latestDate: '', isMe: true };
        myObs.forEach(function(obs) {
            var sp = obs.species, date = obs.date || '';
            if (!myEntry.species[sp]) {
                myEntry.species[sp] = { name: sp, firstDate: date };
            } else if (date < myEntry.species[sp].firstDate) {
                myEntry.species[sp].firstDate = date;
            }
            myEntry.count++;
            if (date > myEntry.latestDate) myEntry.latestDate = date;
        });
        observerMap[MY_NAME] = myEntry;

        // Build sorted species lists
        Object.keys(observerMap).forEach(function(name) {
            var ob = observerMap[name];
            ob.speciesList = Object.keys(ob.species).map(function(sp) { return ob.species[sp]; });
            ob.speciesList.sort(function(a, b) { return a.firstDate.localeCompare(b.firstDate); });
        });

        var observerList = Object.keys(observerMap).map(function(name) {
            var ob = observerMap[name];
            return {
                name: ob.name,
                speciesCount: ob.speciesList.length,
                count: ob.count,
                latestDate: ob.latestDate,
                speciesList: ob.speciesList,
                isMe: ob.isMe
            };
        });
        observerList.sort(function(a, b) { return b.speciesCount - a.speciesCount; });

        myObs.forEach(function(obs) { allSpeciesSet[obs.species] = true; });

        return {
            observers: observerList,
            totalSpecies: Object.keys(allSpeciesSet).length,
            totalObservations: filtered.length + myObs.length
        };
    }

    // ── Datum ──────────────────────────────────────────────
    var MONTHS = ['jan', 'feb', 'mars', 'apr', 'maj', 'juni', 'juli', 'aug', 'sep', 'okt', 'nov', 'dec'];
    function fmtDate(dateStr) {
        if (!dateStr) return '';
        var d = new Date(dateStr);
        return d.getDate() + ' ' + MONTHS[d.getMonth()];
    }

    // ── Render ─────────────────────────────────────────────
    function renderStats(data) {
        document.getElementById('stat-observers').textContent = data.observers.length;
        document.getElementById('stat-species').textContent = data.totalSpecies;
        document.getElementById('stat-observations').textContent = data.totalObservations;
        var now = new Date();
        document.getElementById('kommun-timestamp').textContent =
            'uppdaterad ' + now.toLocaleDateString('sv-SE', { day: 'numeric', month: 'long' }) + ' ' +
            now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
    }

    function renderCards(observerList) {
        var container = document.getElementById('kommun-cards');
        var html = '';

        observerList.forEach(function(ob, i) {
            var rank = i + 1;
            var rankStr = rank + '';

            html += '<div class="kommun-card" data-observer="' + ob.name + '">';
            html += '<div class="kommun-card-header">';
            html += '<span class="kommun-card-rank">' + rankStr + '</span>';
            html += '<div class="kommun-card-info">';
            html += '<span class="kommun-card-name">' + ob.name + '</span>';
            html += '<span class="kommun-card-meta">' + ob.count + ' rapporter · senast ' + fmtDate(ob.latestDate) + '</span>';
            html += '</div>';
            html += '<div class="kommun-card-badge">';
            html += '<span class="kommun-card-badge-num">' + ob.speciesCount + '</span>';
            html += '<span class="kommun-card-badge-label">arter</span>';
            html += '</div>';
            html += '</div></div>';
        });

        container.innerHTML = html;

        // Bind clicks → timeline modal
        container.querySelectorAll('.kommun-card-header').forEach(function(header) {
            header.addEventListener('click', function() {
                var card = header.closest('.kommun-card');
                var name = card.getAttribute('data-observer');
                var ob = allObserverData.find(function(o) { return o.name === name; });
                if (ob) openSpeciesList(ob);
            });
        });
    }

    // ── Species guide för taxonomisk ordning + kategori-färger ──
    var speciesGuide = {};
    var CATEGORY_COLORS = {
        abundant: '#0e7490',
        regular: '#7c3aed',
        uncommon: '#e09f3e',
        rare: '#c1121f',
        new: '#00897b'
    };
    function fetchSpeciesGuide() {
        return fetch('/data/species-guide.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                (data.species || []).forEach(function(sp, i) {
                    speciesGuide[sp.name.toLowerCase()] = {
                        order: i,
                        category: sp.category || 'regular'
                    };
                });
            })
            .catch(function() {});
    }

    // ── Krysslista-modal ───────────────────────────────────
    var currentModalOb = null;
    var currentModalSort = 'date';

    function openSpeciesList(ob) {
        currentModalOb = ob;
        currentModalSort = 'date';

        var modal = document.getElementById('kommun-modal');
        document.getElementById('kommun-modal-title').textContent = ob.name;
        document.getElementById('kommun-modal-subtitle').textContent = ob.speciesCount + ' arter · ' + ob.count + ' rapporter';

        // Reset sort buttons
        document.querySelectorAll('.kommun-modal-sort-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-modal-sort') === 'date');
        });

        renderModalList('date');
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function renderModalList(sortType) {
        if (!currentModalOb) return;
        var list = currentModalOb.speciesList.slice();

        if (sortType === 'taxonomy') {
            list.sort(function(a, b) {
                var ga = speciesGuide[a.name.toLowerCase()] || {};
                var gb = speciesGuide[b.name.toLowerCase()] || {};
                var oa = ga.order !== undefined ? ga.order : 9999;
                var ob2 = gb.order !== undefined ? gb.order : 9999;
                return oa - ob2;
            });
        }
        // date sort is already the default from speciesList

        var html = '';
        list.forEach(function(sp, i) {
            var guide = speciesGuide[sp.name.toLowerCase()] || {};
            var cat = guide.category || 'regular';
            var dotColor = CATEGORY_COLORS[cat] || CATEGORY_COLORS.regular;
            html += '<div class="kl-row">';
            html += '<span class="kl-num">' + (i + 1) + '</span>';
            html += '<span class="kl-dot" style="background:' + dotColor + '" title="' + cat + '"></span>';
            html += '<span class="kl-species">' + sp.name + '</span>';
            html += '<span class="kl-date">' + fmtDate(sp.firstDate) + '</span>';
            html += '</div>';
        });

        document.getElementById('kommun-modal-list').innerHTML = html;
    }

    // Sort buttons in modal
    document.querySelectorAll('.kommun-modal-sort-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.kommun-modal-sort-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentModalSort = btn.getAttribute('data-modal-sort');
            renderModalList(currentModalSort);
        });
    });

    function closeModal() {
        document.getElementById('kommun-modal').style.display = 'none';
        document.body.style.overflow = '';
    }

    document.getElementById('kommun-modal-close').addEventListener('click', closeModal);
    document.getElementById('kommun-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    // ── Sortering & Sök ────────────────────────────────────
    function sortObservers(field) {
        if (currentSort.field === field) {
            currentSort.asc = !currentSort.asc;
        } else {
            currentSort.field = field;
            currentSort.asc = field === 'name';
        }

        var sorted = allObserverData.slice();
        sorted.sort(function(a, b) {
            var va, vb;
            switch (field) {
                case 'name':    return currentSort.asc ? a.name.localeCompare(b.name, 'sv') : b.name.localeCompare(a.name, 'sv');
                case 'species': va = a.speciesCount; vb = b.speciesCount; break;
                case 'count':   va = a.count; vb = b.count; break;
                case 'date':    return currentSort.asc ? a.latestDate.localeCompare(b.latestDate) : b.latestDate.localeCompare(a.latestDate);
                default: return 0;
            }
            return currentSort.asc ? va - vb : vb - va;
        });

        allObserverData = sorted;
        renderCards(allObserverData);
        document.querySelectorAll('.kommun-sort-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-sort') === field);
        });
    }

    function filterObservers(query) {
        var q = query.toLowerCase().trim();
        if (!q) { renderCards(allObserverData); return; }
        renderCards(allObserverData.filter(function(ob) {
            return ob.name.toLowerCase().indexOf(q) !== -1;
        }));
    }

    // ── Init ───────────────────────────────────────────────
    Promise.all([fetchAllObservations(), fetchMyChecklist(), fetchSpeciesGuide()])
        .then(function(results) {
            var data = processObservations(results[0], results[1]);
            allObserverData = data.observers;

            document.getElementById('kommun-loading').style.display = 'none';
            document.getElementById('kommun-observer-list').style.display = 'block';
            document.getElementById('kommun-filter-bar').style.display = 'flex';
            document.getElementById('kommun-source').style.display = 'block';

            renderStats(data);
            renderCards(allObserverData);

            document.querySelectorAll('.kommun-sort-btn').forEach(function(btn) {
                btn.addEventListener('click', function() { sortObservers(btn.getAttribute('data-sort')); });
            });
            document.getElementById('kommun-search').addEventListener('input', function(e) {
                filterObservers(e.target.value);
            });
        })
        .catch(function(err) {
            console.error('Fältligan:', err);
            document.getElementById('kommun-loading').style.display = 'none';
            document.getElementById('kommun-error').style.display = 'block';
        });
})();
</script>
{{ end }}
