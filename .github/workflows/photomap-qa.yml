name: Photo map browser QA
on:
  pull_request:
    paths:
      - 'layouts/galleri/list.html'
      - 'docs/galleri/index.html'
      - 'scripts/test-photomap-*'
      - '.github/workflows/photomap-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.56.1 leaflet@1.9.4
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-photomap-age.cjs
      - run: node scripts/test-photomap-browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: photomap-browser-qa
          path: test-results/photomap/
          retention-days: 7
