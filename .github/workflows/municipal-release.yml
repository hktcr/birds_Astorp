name: Prepare municipal homepage release
on:
  push:
    branches:
      - dev/startsida-kommun-2026-11-20
    paths:
      - '.github/workflows/municipal-release.yml'
      - 'scripts/prepare-municipal-release.cjs'
      - 'scripts/test-municipal-home-browser.cjs'
      - 'scripts/test-municipal-home.cjs'
      - 'scripts/test-prediction*.cjs'
      - 'static/js/municipal*.js'
      - 'static/css/municipal-home.css'
      - 'layouts/index.html'
      - 'layouts/arsprojekt/single.html'
      - 'layouts/partials/header.html'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install the project's Hugo version
        run: |
          mkdir -p "$RUNNER_TEMP/astorp-hugo"
          curl --fail --location --silent --show-error https://github.com/gohugoio/hugo/releases/download/v0.154.5/hugo_extended_0.154.5_linux-amd64.tar.gz -o "$RUNNER_TEMP/astorp-hugo/hugo.tar.gz"
          cd "$RUNNER_TEMP/astorp-hugo"
          echo "372d2f0538b24d2bb9285f0583c1e3b02d023ec2c2b8eb90e5c3bbfb3139fb13  hugo.tar.gz" | sha256sum --check
          tar -xzf hugo.tar.gz hugo
          echo "$RUNNER_TEMP/astorp-hugo" >> "$GITHUB_PATH"
      - name: Fetch and verify current municipal data
        run: node scripts/prepare-municipal-release.cjs
      - name: Build and run existing release checks
        run: |
          bash scripts/build.sh
          node scripts/test-municipal-home.cjs
          node scripts/test-weather.cjs
          node scripts/test-weather-data.cjs
          python3 scripts/test-weather-archive.py
          node scripts/test-prediction-links.cjs
          node scripts/test-predictions.cjs
          node scripts/test-stockholm-dates.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify built desktop and mobile pages
        run: node scripts/test-municipal-home-browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: municipal-home-release-checks
          path: test-results/municipal-home/
          retention-days: 7
      - name: Commit checked build to the approved development branch
        run: |
          test "$GITHUB_REF_NAME" = "dev/startsida-kommun-2026-11-20"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs static/data/municipal-preview.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build and verify municipal homepage for production"
          git push origin HEAD:refs/heads/dev/startsida-kommun-2026-11-20
